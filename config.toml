base_url = "https://joonho3020.github.io"
compile_sass = true
minify_html = true
build_search_index = true

theme = "anemone"

[markdown]
highlight_code = true
highlight_theme = "cheerfully-light"

# Table of contents configuration
toc_min_level = 1
toc_max_level = 6

# Site metadata
title = "Joonho Whangbo"
description = "Ph.D. student in Computer Science at UC Berkeley"

# Open external links in new tab
external_links_target_blank = true

# Taxonomies
# You can enable tags later if desired
# taxonomies = [ { name = "tags" } ]

[extra]
# List articles on the homepage via theme support
list_pages = true
# Optional: show author on posts
display_author = true
# Optional header nav
header_nav = [
  { url = "/", name_en = "home" },
  { url = "/articles/", name_en = "articles" },
]
