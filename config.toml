base_url = "https://joonho3020.github.io"
compile_sass = true
minify_html = true
build_search_index = true

# Site metadata
title = "Joonho Whangbo"
description = "Joonho Whangbo's writing on computer architecture, hardware design, RTL simulation, FPGAs, and high-level synthesis."

theme = "anemone"

[markdown]

# Open external links in new tab
external_links_target_blank = true

[markdown.highlighting]
style = "inline"
# theme = "solarized-light"
# theme = "catppuccin-latte"
theme = "github-light"

# Taxonomies
# You can enable tags later if desired
# taxonomies = [ { name = "tags" } ]

[extra]
author = "Joonho Whangbo"
# List articles on the homepage via theme support
list_pages = true
# Optional: show author on posts
display_author = true
# Optional header nav
header_nav = [
  { url = "/", name_en = "home" },
  { url = "/articles/", name_en = "articles" },
]
